<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <style>
      .pet { fill: none; stroke: #7ec8c3; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.55; }
      .pet-soft { fill: none; stroke: #9fd9d5; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.35; }
    </style>
  </defs>

  <!-- Dog -->
  <g class="pet" transform="translate(28 36)">
    <ellipse cx="36" cy="48" rx="22" ry="18"/>
    <circle cx="22" cy="28" r="12"/>
    <path d="M14 20 L10 6 L20 16"/>
    <path d="M30 16 L34 4 L38 18"/>
    <path d="M48 42 Q62 36 58 52"/>
    <circle cx="18" cy="26" r="1.4" fill="#7ec8c3" stroke="none"/>
    <circle cx="26" cy="26" r="1.4" fill="#7ec8c3" stroke="none"/>
  </g>

  <!-- Cat -->
  <g class="pet-soft" transform="translate(170 20)">
    <circle cx="30" cy="34" r="16"/>
    <path d="M16 24 L18 8 L28 22"/>
    <path d="M32 22 L42 8 L44 24"/>
    <path d="M22 40 Q30 46 38 40"/>
    <circle cx="24" cy="32" r="1.3" fill="#9fd9d5" stroke="none"/>
    <circle cx="36" cy="32" r="1.3" fill="#9fd9d5" stroke="none"/>
    <path d="M46 38 Q60 28 58 48"/>
  </g>

  <!-- Bird -->
  <g class="pet" transform="translate(310 48)">
    <ellipse cx="28" cy="30" rx="18" ry="12"/>
    <circle cx="44" cy="24" r="8"/>
    <path d="M50 24 L60 22"/>
    <path d="M18 28 Q8 18 4 28 Q12 34 18 30"/>
    <path d="M24 40 L20 52"/>
    <path d="M32 40 L36 52"/>
  </g>

  <!-- Rabbit -->
  <g class="pet-soft" transform="translate(40 160)">
    <ellipse cx="28" cy="42" rx="16" ry="20"/>
    <circle cx="28" cy="22" r="12"/>
    <path d="M20 14 Q16 -2 24 12"/>
    <path d="M36 14 Q40 -2 32 12"/>
    <circle cx="24" cy="22" r="1.2" fill="#9fd9d5" stroke="none"/>
    <circle cx="32" cy="22" r="1.2" fill="#9fd9d5" stroke="none"/>
    <path d="M40 48 Q54 42 50 58"/>
  </g>

  <!-- Fish -->
  <g class="pet" transform="translate(180 170)">
    <ellipse cx="34" cy="28" rx="22" ry="12"/>
    <path d="M14 28 L2 18 L6 28 L2 38 Z"/>
    <path d="M34 16 Q40 8 46 16"/>
    <circle cx="46" cy="26" r="1.5" fill="#7ec8c3" stroke="none"/>
  </g>

  <!-- Paw -->
  <g class="pet-soft" transform="translate(320 155)">
    <ellipse cx="28" cy="40" rx="14" ry="12"/>
    <circle cx="12" cy="22" r="6"/>
    <circle cx="24" cy="14" r="6"/>
    <circle cx="38" cy="14" r="6"/>
    <circle cx="48" cy="24" r="6"/>
  </g>

  <!-- Bone -->
  <g class="pet" transform="translate(90 280)">
    <rect x="18" y="22" width="40" height="10" rx="5"/>
    <circle cx="16" cy="18" r="7"/>
    <circle cx="16" cy="36" r="7"/>
    <circle cx="60" cy="18" r="7"/>
    <circle cx="60" cy="36" r="7"/>
  </g>

  <!-- Cat sitting -->
  <g class="pet-soft" transform="translate(230 275)">
    <path d="M20 56 Q18 28 34 24 Q50 28 48 56 Z"/>
    <circle cx="34" cy="18" r="11"/>
    <path d="M26 12 L24 0 L32 10"/>
    <path d="M36 10 L44 0 L42 12"/>
    <path d="M48 40 Q62 30 58 52"/>
  </g>

  <!-- Bird flying -->
  <g class="pet" transform="translate(360 280)">
    <path d="M8 28 Q24 8 40 28"/>
    <path d="M40 28 Q56 8 72 28"/>
    <circle cx="40" cy="30" r="5"/>
  </g>

  <!-- Small dog -->
  <g class="pet-soft" transform="translate(20 360)">
    <ellipse cx="32" cy="34" rx="20" ry="14"/>
    <circle cx="50" cy="26" r="10"/>
    <path d="M44 20 L42 8 L50 18"/>
    <path d="M54 18 L60 8 L58 20"/>
    <path d="M12 34 Q4 28 6 40"/>
    <path d="M24 46 L22 58"/>
    <path d="M40 46 L42 58"/>
  </g>

  <!-- Rabbit hopping -->
  <g class="pet" transform="translate(170 370)">
    <ellipse cx="30" cy="30" rx="18" ry="12"/>
    <circle cx="46" cy="22" r="9"/>
    <path d="M42 14 Q40 0 46 12"/>
    <path d="M50 12 Q54 0 52 14"/>
    <path d="M14 34 Q6 40 10 46"/>
    <path d="M24 40 L18 52"/>
  </g>

  <!-- Fish swimming -->
  <g class="pet-soft" transform="translate(320 370)">
    <ellipse cx="30" cy="28" rx="20" ry="10"/>
    <path d="M48 28 L62 18 L58 28 L62 38 Z"/>
    <path d="M24 18 Q30 10 36 18"/>
    <circle cx="18" cy="26" r="1.4" fill="#9fd9d5" stroke="none"/>
  </g>
</svg>
